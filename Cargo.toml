[workspace]
resolver = "2"
members = [
  "core/crates/mat",
  "core/crates/logistics",
  "core/crates/items",
  "core/crates/inventory",
  "core/crates/save",
  "core/crates/render",
  "core/crates/cli",
  "bridge/rose-godot",
  "tools",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/deadcoast/Cyberpunk-ROSE"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
png = "0.18"
clap = { version = "4", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
