[package]
name = "rose-godot"
description = "GDExtension exposing the ROSE core to Godot 4"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
mat = { path = "../../core/crates/mat" }
logistics = { path = "../../core/crates/logistics" }
godot = { version = "0.5", features = ["api-4-5"] }
items = { path = "../../core/crates/items" }
inventory = { path = "../../core/crates/inventory" }
bench = { path = "../../core/crates/bench" }
save = { path = "../../core/crates/save" }
run = { path = "../../core/crates/run" }
people = { path = "../../core/crates/people" }
colony = { path = "../../core/crates/colony" }
progress = { path = "../../core/crates/progress" }
story = { path = "../../core/crates/story" }
game = { path = "../../core/crates/game" }
threat = { path = "../../core/crates/threat" }
economy = { path = "../../core/crates/economy" }
render = { path = "../../core/crates/render" }
toml.workspace = true
postcard.workspace = true
