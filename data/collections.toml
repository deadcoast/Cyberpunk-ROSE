# The collections (Full Design v3.18, Progression: Collections). The Scrapdex is every item but these categories.
# A curio set's passive holds while three of the set are in the Stash. A trophy is the first kill of a body (by the
# run crate's creature id or the threat crate's role) or a hazard lived through with the Heart standing.

scrapdex_skip = ["organic"]

[[set]]
id = "street"
name = "Street set"
flag = "scav_yield_plus_1"
text = "+1 scav yield: every pile dug and container opened rolls one item more."
design = "v3.0"

[[set]]
id = "arasaka"
name = "Arasaka set"
flag = "locks_open"
text = "A locked locker opens by hand as an unlocked one: no forcing, no damage."
design = "v3.0"

[[set]]
id = "reliquary"
name = "Reliquary set"
flag = "attention_decay_plus_1"
text = "Attention decays 1 more a shift at every grate."
design = "v3.0"

[[set]]
id = "feral"
name = "Feral set"
flag = "notice_minus_1"
text = "Sewerats notice a Runner a tile later."
design = "v3.18"

[[set]]
