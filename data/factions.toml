# Cyberpunk: ROSE — the surface's factions (Full Design v3.15, Economy; research 19).
# Numbers marked Pass 1 are its; the rest are this design's. A day is three shifts (the surface's clock).

[rules]
# the demand walk: each day a quarter of the way back to the buy-list value, plus a seeded step of up to `step`
revert = 0.25
step = 0.06
# the band the walk is measured against (the proof) and the range the day's demand is clamped to (the Items formula)
band = 0.3
range = [0.6, 1.6]
# reputation: steps of `favour`; Pass 1's 30 % at the ends is `rep_price` a step
favour = 20
rep_price = 0.1
# +3 needs Ivan's Parley (Pass 1; Phase E)
rep_cap = 2
# a link +4 favour, its rival -2; a chain +1 reputation; a miss -1
link_favour = 4
rival_favour = 2
# below reputation 0 a faction comes round a favour a shift (research 19: RimWorld's goodwill drifts back toward its
# natural range, 0.2 a day from below), so -3 reopens in twenty shifts
recover = 1
# the stall's haggling: a Trade level is this much on what it sells for and off what it buys for (research 19)
haggle = 0.02
# vendors sell at base x markup (research 19: RimWorld's 140 / 60 spread is 2.3x)
markup = 2.0
# stock tiers: the reputation and the eddies traded (both ways) each needs; tier 1 needs no volume
tier_rep = [-2, 0, 1, 2]
tier_volume = [0, 150, 600, 2000]
# contracts: offers a faction shows, days an offer stands, links in a chain, a link's growth (Pass 2: a 5-link chain
# pays triple five singles -> 1.55^0 + ... + 1.55^4 = 14.5 first links)
offers = 3
offer_days = 3
chain = [3, 5]
growth = 1.55
# a chain's unique item comes at this condition
unique_condition = 90

# The streets: the first grate of the founding stratum is always `first`; each faction in `every` works at least one
# more grate of the stratum; the rest roll by the stratum's weights (Pass 1's strata: Badges along the Service
# Tunnels, Corpo in the Vault).
[streets]
first = "nomads"
every = ["gangs", "badges", "corpo"]

[[streets.stratum]]
weights = { nomads = 3, gangs = 3, badges = 2, corpo = 1 }
[[streets.stratum]]
weights = { nomads = 3, gangs = 3, badges = 2, corpo = 1 }
[[streets.stratum]]
weights = { nomads = 2, gangs = 3, badges = 2, corpo = 1 }
[[streets.stratum]]
weights = { nomads = 2, gangs = 2, badges = 4, corpo = 1 }
[[streets.stratum]]
weights = { nomads = 1, gangs = 2, badges = 2, corpo = 4 }
[[streets.stratum]]
weights = { nomads = 2, gangs = 2, badges = 2, corpo = 3 }

# The surface's events, rolled once a day: chance a day, days, and pushes on the day's demand ({faction or "all",
# category, tier or "" for every tier, offset}). flush: a clinic day's shift end brings a newcomer flush, twice the
# size. stock: the faction's units a day multiplied. chapter: Phase E.
[[event]]
id = "gang_war"
name = "gang war topside"
chance = 0.08
days = 2
push = [{ faction = "all", category = "chrome", tier = "uncommon", offset = -0.3 }, { faction = "gangs", category = "gear", tier = "", offset = 0.2 }]

[[event]]
id = "clinic_day"
name = "clinic day"
chance = 0.10
days = 1
flush = true

[[event]]
id = "deployment"
name = "Oathkeeper deployment"
chance = 0.06
days = 2
push = [{ faction = "gangs", category = "contraband", tier = "", offset = 0.3 }, { faction = "corpo", category = "contraband", tier = "", offset = 0.3 }]

[[event]]
id = "convoy"
name = "trader convoy"
chance = 0.08
days = 1
stock = { nomads = 2.0 }
push = [{ faction = "nomads", category = "all", tier = "", offset = 0.1 }]

[[event]]
id = "occupation"
name = "the occupation"
chance = 0.0
days = 0
chapter = 6
stock_item = { org_paste = 0.5 }

# ---------------------------------------------------------------- the factions
# demand: a category's buy-list value (absent: 1.0); items: an item's own multiplier on top; refuses: categories or
# tiers nobody at the stall buys; fence: the tier at which the faction buys Blackline. stock: tier, item (or service),
# units a day, fixed (always there) or rotating (`rotate` of the faction's rotating entries a day), price where the
# base is nothing. contracts: kind, ask, shifts, eddies; deliver asks a category (and tier) at a condition.

