# Cyberpunk: ROSE — loot tables (research 08). Resolved D2-style: NoDrop, then category by weight, then tier from the
# row for the source's tier (1-6 = stratum; crates are chunk stratum + 1), then an item uniformly from that category
# and tier, stepping down a tier when none exists. Tier rows are [common, uncommon, rare, blackline, relic] weights.
# S2 tops out at Uncommon (design): rows 1 and 2 carry no Rare. Relic appears only in `cache`.
#
# count       [min, max] picks
# nodrop      chance per pick that nothing drops (0-1)
# condition   [lo, hi] found condition
# categories  weights; a category absent here never drops from this source
# rows        one tier-weight row per source tier 1..6
# notable     which tier index and up counts as a notable for PRD (2 = Rare and up)

