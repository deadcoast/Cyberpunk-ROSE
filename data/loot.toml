[rules]
# first-run generosity (research 02): first N opens of a route's first run roll the row one tier up
generous_opens = 3
# lockers: chance of being locked at tier 1 and the rise per tier
locker_locked = 0.30
locker_locked_per_tier = 0.05
# condition lost by half the contents when a locked locker is forced without a pry bar
force_damage = 30
# noise of opening (noise.rs loudness scale 0-15)
noise_locker = 3
noise_locker_pry = 4
noise_locker_force = 8
noise_crate_pry = 3
noise_crate_force = 6
noise_corpse = 4
noise_pile = 2

