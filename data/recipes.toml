# Bench recipes by craft tag (Full Design v3.5, Bench). A slot names a tag and the stat it drives; any item
# carrying the tag fills it. Special tags: "gear" (a piece of gear already in the Stash), "unidentified" (any
# unidentified item), "spore" (Spore Tissue or a Spore Cap). Products starting with @ are jobs on the gear slot:
# @repair (+40 condition), @identify (one shift), @spored. Tier 1 is open at launch; 2-4 open with blueprints.
# Shifts per tier: 1, 1, 2, 3. Stats from parts: +-15 % per part tier above/below the recipe tier (0.7-1.6x) for
# dmg/armour/light/mag; noise -1 per tier above, +1 below; condition = mean of parts, housing counted twice.

[rules]
tier_shifts = [1, 1, 2, 3]
step = 0.15
min_mult = 0.7
max_mult = 1.6
repair_gain = 40

[[recipe]]
id = "pipe_club"
name = "Pipe Club"
tier = 1
product = "ger_pipe"
slots = [{ tag = "housing", drives = "dmg" }, { tag = "housing", drives = "condition" }]

