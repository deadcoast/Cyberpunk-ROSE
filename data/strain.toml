name = "Sphincter"
gene = "chrome"
line = 0.5
site = "passage"
housing = "gate"
text = "A gate of 100 HP, shut to Oathkeepers, creatures and the Flood, open to slimos; shut while white light is near."
art = "mat.organ.sphincter"
pass1 = true

[[organ]]
