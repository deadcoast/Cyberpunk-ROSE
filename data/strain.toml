# The strain's progression (Full Design v3.18, Progression: Organs, Strain classes, The Strainbook; Pass 1's Genome;
# Pass 2's Pillar 6). Genes by name: vigor branching thrift appetite lume toxicity chrome feral conductance plasticity.
# An organ grows by itself at a Node once its gene crosses its line; site is where (any, water, passage, far, deposit,
# junction, feral, trunk); cap: the strain holds at most 1 + Nodes / 30 of an organ. pass1: true where Pass 1 names it.

organ_spacing = 3
organ_per_nodes = 30
# three classes are held only within this many shifts of a Relic fed (Pass 2: the Relic state)
relic_state_shifts = 10

[[organ]]
id = "bulb"
name = "Lume Bulb"
gene = "lume"
line = 0.6
site = "any"
housing = "lume_farm"
text = "Light 1 + 6 x Lume tiles; +1 Attention a shift at a grate within 10; dark while its zone's Attention is over its line."
art = "mat.organ.bulb"
pass1 = true

[[organ]]
id = "lung"
name = "Filter Lung"
gene = "thrift"
line = 0.55
site = "water"
housing = "lung"
text = "Homes within 6 are dry; a Flood rises a tile less within 12."
art = "mat.organ.lung"
pass1 = true

[[organ]]
