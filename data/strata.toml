# Cyberpunk: ROSE — the stack (Full Design v3.19, Progression: The stack and the breach). Six strata of 192 x 48
# in one Mat of 192 x 288, the Sump at the bottom. Pass 1's strata table gives what each is; the ground weights are
# this design's, the Sump's the prototype's (the single-stratum map before the stack).
#
# Fields: n (1 the Sump) name short region (the Route Board's route name) key (the grate key that opens this
# stratum's ceiling, an item id) ground: culvert_from culvert_every culvert_half pipe_above cave deposit water_rows.

rows = 48
width = 192

[[stratum]]
n = 1
name = "the Sump"
short = "SUMP"
region = "SUMP EAST"
key = "key_grate_sump"
note = "black water, silt, the Heart"
ground = { culvert_from = 12, culvert_every = 13, culvert_half = 1, pipe_above = 2, cave = 0.56, deposit = 0.025, water_rows = 1 }

