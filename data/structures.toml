# The 25 structures (Full Design v3.12, Colony mode: Building and The 25 structures). footprint [w, h] in tiles on
# Cord or Node; sigma: signal the footprint needs; node: a Node under the anchor; grate: a grate within 2 tiles;
# relay: on a Relay. cost is tier 1 (tier 2 x2, tier 3 x3); build: points (a builder adds Hands per shift).
# hosts: the job the structure gives slots to, slots per tier; gate: the level of that job's skill a slimo needs for the slot. Per-tier numbers are arrays indexed by tier - 1
# (the Heart has four). hp is per tier. art: the manifest slot. category: the Build menu's tab (city: prebuilt; organ:
# the Mat's own, stood on an organ when it grows and never in the Build menu; Full Design v3.18, Organs).
# organ: the organ the anchor must stand on (a housing); free_on: an organ the anchor may stand on to cost nothing;
# shuts: a gate to bodies and water; damage/range: strikes (with a Guard in the seat when it hosts guard);
# oath_only: strikes Oathkeepers only. The tree's nodes name the structures they let be placed (data/tech.toml).

