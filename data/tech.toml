# The tech tree (Full Design v3.18, Progression: Research; Pass 2's Pillar 6; research 21). Three branches, four tiers,
# three nodes a tier. Tier 1 is the founding's kit and stands researched. A branch's tiers 2-4 open when its blueprint
# I-III is studied. A node of an open tier costs its tier's points and Parts and Chrome; slimos on Research at a
# Tweaker Bench add their Tweak level in points a shift.
# structures: the structure ids it lets be placed; laws: the law ids it lets be signed; flags: the numbers the crates
# read. pass2: true where Pass 2 names the node, false where it is this design's.

# points, parts, chrome by tier (index tier - 1; tier 1 is the founding's)
points = [0, 24, 48, 96]
parts = [0, 6, 10, 16]
chrome = [0, 2, 4, 8]
# studying blueprint I-III (opens tier 2-4)
study = [8, 16, 32]
research_gate = 2

[blueprints]
chrome = ["tec_blueprint_chrome1", "tec_blueprint_chrome2", "tec_blueprint_chrome3"]
flesh = ["tec_blueprint_flesh1", "tec_blueprint_flesh2", "tec_blueprint_flesh3"]
mycelium = ["tec_blueprint_myc1", "tec_blueprint_myc2", "tec_blueprint_myc3"]

