# The forty traits (Full Design v3.7, Runners and slimos: Traits). Two per slimo at creation, no excluded pair.
# stats: leans on body/nerve/hands/eye/matsense/voice. need_rate: multipliers on Fed/Lit/Dry/Signal/Rest decay (Rest on
# its regen). mood: a lean on the Mood target. loves/hates: a job (working it moves the target +10/-15). skill_xp:
# multipliers. rig_rows: backpack rows. flags: what the run and colony check. carry: kg. Levels: skills at creation.

[[trait]]
id = "hoarder"
name = "Hoarder"
text = "Two more rows in the rig and a nerve that frays holding them."
stats = { nerve = -1 }
loves = "scav"
rig_rows = 2

[[trait]]
id = "night_eyes"
name = "Night Eyes"
text = "Sees a tile farther into the dark; the dark is not a need."
need_rate = { lit = 0.5 }
flags = ["see_plus_1"]

[[trait]]
id = "loud"
name = "Loud"
text = "Every sound they make carries one louder; so does their voice."
stats = { voice = 1 }
flags = ["noise_plus_1"]
excludes = ["soft_voice"]

[[trait]]
id = "steady_hands"
